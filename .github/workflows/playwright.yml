name: Daily Statutory Report Download
on:
  schedule:
    # 16:00 IST = 10:30 UTC (GitHub may start scheduled runs a few minutes late)
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statutory-report-download
  cancel-in-progress: false

jobs:
  download:
    timeout-minutes: 240
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install captcha model dependencies (CPU)
        # The test auto-detects captcha_reader_model/.venv
        run: |
          python -m venv captcha_reader_model/.venv
          captcha_reader_model/.venv/bin/pip install --quiet torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          captcha_reader_model/.venv/bin/pip install --quiet transformers==5.16.1 pillow==12.3.0 pypdfium2 pandas openpyxl

      # No local checkpoint in CI, so predict_hf.py loads ankit0982/captcha from Hugging Face
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-model-ankit0982-captcha-v1
      - name: Download captcha model from Hugging Face
        # Done before the test so the worker's 60s startup timeout isn't spent downloading
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: captcha_reader_model/.venv/bin/python -c "from huggingface_hub import snapshot_download; print(snapshot_download('ankit0982/captcha'))"

      - name: Download statutory reports
        # Dates come from USE_YESTERDAY / START_DATE / END_DATE in the test file
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: pnpm exec playwright test src/tests/autoCaptchaDownload.spec.js --project=chromium

      - name: Upload downloaded PDFs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: statutory-reports-${{ github.run_number }}
          path: data/**/*.pdf
          if-no-files-found: warn
          retention-days: 30
      - name: Upload extracted Form 10 Excel
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: form10-excel-${{ github.run_number }}
          path: |
            captcha_reader_model/data_processing/output/*.xlsx
            captcha_reader_model/dataprocessing/output/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
