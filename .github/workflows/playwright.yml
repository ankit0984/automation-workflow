name: Daily Statutory Report Download
on:
  schedule:
    # 16:00 IST = 10:30 UTC (GitHub may start scheduled runs a few minutes late)
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner environment (use self-hosted if in India)'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

concurrency:
  group: statutory-report-download
  cancel-in-progress: false

jobs:
  download:
    timeout-minutes: 240
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      MAC_NODE: ${{ secrets.TS_MAC_NODE }}
      ANDROID_NODE: ${{ secrets.TS_ANDROID_NODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Cache Playwright Chromium binary (~130MB) so it takes 0s on cache hit
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Cache the entire Python virtualenv so PyTorch and Transformers restore in ~3s
      - name: Cache Python virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: captcha_reader_model/.venv
          key: venv-py313-torch-v2

      - name: Install captcha model dependencies (CPU)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          uv venv captcha_reader_model/.venv --python 3.13
          uv pip install --python captcha_reader_model/.venv/bin/python \
            --index https://download.pytorch.org/whl/cpu \
            torch torchvision transformers pillow pypdfium2 pandas openpyxl gspread

      # Cache downloaded model archive between workflow runs
      - name: Cache captcha model archive
        id: cache-model
        uses: actions/cache@v4
        with:
          path: /tmp/best_hf_captcha_model.zip
          key: captcha-model-v1.0.0

      - name: Download captcha model from GitHub Release
        if: steps.cache-model.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.0 --repo ${{ github.repository }} --pattern "best_hf_captcha_model.zip" --dir /tmp

      - name: Extract captcha model
        run: |
          mkdir -p captcha_reader_model/model_training/checkpoints/best_hf_captcha_model
          unzip -q -o /tmp/best_hf_captcha_model.zip -d captcha_reader_model/model_training/checkpoints/best_hf_captcha_model

      # Connect to Tailscale only right before running tests so all 2.5GB dependencies download fast on GitHub CDN
      - name: Connect to Tailscale
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure Tailscale Exit Node (Mac with Android Failover)
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        run: |
          echo "=== Tailscale Network Status ==="
          tailscale status || true

          echo "=== Available Exit Nodes ==="
          tailscale exit-node list || true

          # Strip any accidental whitespace/newlines
          MAC=$(echo "${MAC_NODE:-100.108.30.75}" | tr -d '[:space:]')
          ANDROID=$(echo "${ANDROID_NODE:-100.125.5.44}" | tr -d '[:space:]')

          route_success=false

          # 1. Try Mac Exit Node
          if [ -n "$MAC" ]; then
            echo "Attempting to route through Mac exit node: $MAC..."
            sudo tailscale set --exit-node="$MAC" --exit-node-allow-lan-access=true || true
            sleep 2
            COUNTRY=$(curl -s --max-time 5 https://ipinfo.io/country | tr -d '[:space:]' || true)
            echo "Egress Country via Mac: '$COUNTRY'"
            if [ "$COUNTRY" = "IN" ]; then
              echo "✓ Successfully routed through Mac Indian exit node!"
              route_success=true
            else
              echo "⚠️ Mac is not routing traffic to India (got '$COUNTRY')."
            fi
          fi

          # 2. Try Android Exit Node if Mac failed
          if [ "$route_success" = false ] && [ -n "$ANDROID" ]; then
            echo "Failing over: Attempting to route through Android exit node: $ANDROID..."
            sudo tailscale set --exit-node="$ANDROID" --exit-node-allow-lan-access=true || true
            sleep 2
            COUNTRY=$(curl -s --max-time 5 https://ipinfo.io/country | tr -d '[:space:]' || true)
            echo "Egress Country via Android: '$COUNTRY'"
            if [ "$COUNTRY" = "IN" ]; then
              echo "✓ Successfully routed through Android Indian exit node!"
              route_success=true
            else
              echo "⚠️ Android is not routing traffic to India (got '$COUNTRY')."
            fi
          fi

          echo "=== Final Public IP Verification ==="
          curl -s --max-time 5 https://ipinfo.io/json || true

          if [ "$route_success" = false ]; then
            echo "❌ ERROR: Neither Mac ($MAC) nor Android ($ANDROID) successfully routed internet through India."
            echo "IMPORTANT: In Tailscale Admin Console (https://login.tailscale.com/admin/machines):"
            echo "1. Find your Mac and Android devices."
            echo "2. Click '...' -> 'Edit route settings...'."
            echo "3. Turn ON 'Use as exit node' for both devices."
            exit 1
          fi

      - name: Download statutory reports
        # Dates come from USE_YESTERDAY / START_DATE / END_DATE in the test file
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PYTHONUNBUFFERED: '1'
          FORCE_COLOR: '1'
        run: pnpm exec playwright test src/tests/autoCaptchaDownload.spec.js --project=chromium --reporter=list

      - name: Upload downloaded PDFs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: statutory-reports-${{ github.run_number }}
          path: data/**/*.pdf
          if-no-files-found: warn
          retention-days: 30
      - name: Upload extracted Form 10 Excel
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: form10-excel-${{ github.run_number }}
          path: |
            captcha_reader_model/data_processing/output/*.xlsx
            captcha_reader_model/dataprocessing/output/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
