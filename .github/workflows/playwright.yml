name: Daily Statutory Report Download
on:
  schedule:
    # 16:00 IST = 10:30 UTC (GitHub may start scheduled runs a few minutes late)
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner environment (use self-hosted if in India)'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

concurrency:
  group: statutory-report-download
  cancel-in-progress: false

jobs:
  download:
    timeout-minutes: 240
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install captcha model dependencies (CPU)
        # The test auto-detects captcha_reader_model/.venv
        run: |
          python -m venv captcha_reader_model/.venv
          captcha_reader_model/.venv/bin/pip install --quiet torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          captcha_reader_model/.venv/bin/pip install --quiet transformers==5.16.1 pillow==12.3.0 pypdfium2 pandas openpyxl gspread

      # Cache downloaded model archive between workflow runs
      - name: Cache captcha model archive
        id: cache-model
        uses: actions/cache@v4
        with:
          path: /tmp/best_hf_captcha_model.zip
          key: captcha-model-v1.0.0

      - name: Download captcha model from GitHub Release
        if: steps.cache-model.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.0 --repo ${{ github.repository }} --pattern "best_hf_captcha_model.zip" --dir /tmp

      - name: Extract captcha model
        run: |
          mkdir -p captcha_reader_model/model_training/checkpoints/best_hf_captcha_model
          unzip -q -o /tmp/best_hf_captcha_model.zip -d captcha_reader_model/model_training/checkpoints/best_hf_captcha_model

      - name: Download statutory reports
        # Dates come from USE_YESTERDAY / START_DATE / END_DATE in the test file
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: pnpm exec playwright test src/tests/autoCaptchaDownload.spec.js --project=chromium

      - name: Upload downloaded PDFs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: statutory-reports-${{ github.run_number }}
          path: data/**/*.pdf
          if-no-files-found: warn
          retention-days: 30
      - name: Upload extracted Form 10 Excel
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: form10-excel-${{ github.run_number }}
          path: |
            captcha_reader_model/data_processing/output/*.xlsx
            captcha_reader_model/dataprocessing/output/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
